name: Publish Python distributions to PyPI
 
on: push
 
jobs:
  build-n-publish:
    name: Build and publish Python distributions to PyPI
    runs-on: ubuntu-latest  # ここは 'build-n-publish:' より2スペース深く
    steps:                  # ここも 'build-n-publish:' より2スペース深く
      - uses: actions/checkout@master
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install pypa/build
        run: python -m pip install build --user # 'run: >-' の >- は不要
      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir dist/ # 'run: >-' の >- は不要
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__ # ここも 'with:' より2スペース深く
          password: ${{ secrets.PYPI_API_TOKEN }} # secrets.*PYPI_API_TOKEN* の * は不要